name: Sync Skills to All Repos

on:
  workflow_dispatch:
    inputs:
      repos:
        description: 'Repos para sincronizar (comma-separated, ou "all" para todos)'
        type: string
        default: "all"
      dry_run:
        description: "Apenas listar o que mudaria, sem fazer push"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-skills
  cancel-in-progress: false

jobs:
  disabled:
    runs-on: ubuntu-latest
    if: inputs.dry_run != true && vars.SKILLS_SYNC_ENABLED != 'true'
    steps:
      - name: Aviso de sync desligada
        run: |
          echo "::warning title=Sync de skills desligada::A variável SKILLS_SYNC_ENABLED não é 'true' neste repositório; nada foi sincronizado. Cadastre a variável (e o secret GH_TOKEN) para ligar."

  sync:
    runs-on: ubuntu-latest
    if: inputs.dry_run == true || vars.SKILLS_SYNC_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Sync skills to repos based on config
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          INPUT_REPOS: ${{ inputs.repos }}
        run: |
          set -uo pipefail

          ORG="revtriever-vera"
          CONFIG_FILE="skills/sync-config.json"
          BRANCH="main"
          DRY_RUN="${DRY_RUN:-false}"
          INPUT_REPOS="${INPUT_REPOS:-all}"
          SKILL_PORTS_FILE="$GITHUB_WORKSPACE/skills/backend/local-dev/SKILL.md"

          git_auth() {
            git -c "http.extraheader=AUTHORIZATION: basic ${AUTH_B64}" "$@"
          }

          expand_ports() {
            local token start end
            for token in "$@"; do
              if [[ "$token" =~ ^([0-9]+)-([0-9]+)$ ]]; then
                start="${BASH_REMATCH[1]}"; end="${BASH_REMATCH[2]}"
                seq "$start" "$end"
              elif [[ "$token" =~ ^[0-9]+$ ]]; then
                echo "$token"
              fi
            done | sort -n | uniq
          }

          skill_ports() {
            awk -F'|' '/^\| *(postgres|redis|localstack|mailpit|lgtm) /{print $4}' "$SKILL_PORTS_FILE" \
              | sed -E 's/\([^)]*\)//g; s/–/-/g; s#/# #g' \
              | tr -s ' ' '\n' | grep -E '^[0-9]+(-[0-9]+)?$' || true
          }

          compose_ports() {
            grep -E "^[[:space:]]*-[[:space:]]*['\"]?[0-9]+(-[0-9]+)?:[0-9]+(-[0-9]+)?['\"]?[[:space:]]*$" "$1" \
              | sed -E "s/^[[:space:]]*-[[:space:]]*['\"]?([0-9]+(-[0-9]+)?):.*/\1/" || true
          }

          check_local_dev_ports() {
            local compose="$1" skill_set compose_set
            local -a skill_tokens compose_tokens
            [ -f "$compose" ] && [ -f "$SKILL_PORTS_FILE" ] || return 0
            mapfile -t skill_tokens < <(skill_ports)
            mapfile -t compose_tokens < <(compose_ports "$compose")
            skill_set=$(expand_ports "${skill_tokens[@]}")
            compose_set=$(expand_ports "${compose_tokens[@]}")
            if [ -z "$skill_set" ] || [ -z "$compose_set" ]; then
              echo "::warning title=Portas do local-dev não verificadas::Não foi possível extrair as portas da skill backend/local-dev ou do docker-compose.yml de $REPO."
              return 0
            fi
            if [ "$skill_set" != "$compose_set" ]; then
              echo "::warning title=Portas do local-dev divergem::As portas da skill backend/local-dev diferem do docker-compose.yml de $REPO. Só na skill: $(comm -23 <(echo "$skill_set") <(echo "$compose_set") | tr '\n' ' ')| só no compose: $(comm -13 <(echo "$skill_set") <(echo "$compose_set") | tr '\n' ' ')"
            fi
          }

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ Config não encontrado: $CONFIG_FILE"
            exit 1
          fi

          declare -A REPO_FOLDERS

          for group in $(jq -r '.groups | keys[]' "$CONFIG_FILE"); do
            folders=$(jq -r ".groups[\"$group\"].folders | join(\",\")" "$CONFIG_FILE")
            for repo in $(jq -r ".groups[\"$group\"].repos[]" "$CONFIG_FILE"); do
              if [ -n "${REPO_FOLDERS[$repo]:-}" ]; then
                REPO_FOLDERS[$repo]="${REPO_FOLDERS[$repo]},$folders"
              else
                REPO_FOLDERS[$repo]="$folders"
              fi
            done
          done

          if [ "$INPUT_REPOS" != "all" ]; then
            IFS=',' read -ra SELECTED <<< "$INPUT_REPOS"
            declare -A SELECTED_MAP
            for r in "${SELECTED[@]}"; do SELECTED_MAP[$(echo "$r" | xargs)]=1; done
            for repo in "${!REPO_FOLDERS[@]}"; do
              [ -z "${SELECTED_MAP[$repo]:-}" ] && unset "REPO_FOLDERS[$repo]"
            done
            echo "🎯 Filtro ativo: ${SELECTED[*]}"
          fi

          echo "📦 Repos a sincronizar: ${#REPO_FOLDERS[@]}"
          echo ""

          SYNCED=0; UNCHANGED=0; FAILED=0

          for REPO in "${!REPO_FOLDERS[@]}"; do
            IFS=',' read -ra RAW_FOLDERS <<< "${REPO_FOLDERS[$REPO]}"
            declare -A SEEN; FOLDERS=()
            for f in "${RAW_FOLDERS[@]}"; do
              if [ -z "${SEEN[$f]:-}" ]; then SEEN[$f]=1; FOLDERS+=("$f"); fi
            done
            unset SEEN

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📂 $REPO ← [${FOLDERS[*]}]"

            if [ "$DRY_RUN" = "true" ]; then
              echo "  🔍 [dry run] folders: ${FOLDERS[*]}"
              continue
            fi

            if [ -z "${GH_TOKEN:-}" ]; then
              echo "::error title=Secret GH_TOKEN ausente::O PAT com Contents: Read and write em $ORG/$REPO não está cadastrado como secret GH_TOKEN neste repositório; a sync não consegue dar push nos repos destino."
              FAILED=$((FAILED + 1))
              continue
            fi

            AUTH_B64=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::$AUTH_B64"

            TMPDIR=$(mktemp -d)
            if ! git_auth clone --depth 1 --branch "$BRANCH" \
                "https://github.com/$ORG/$REPO.git" \
                "$TMPDIR/$REPO" 2>&1; then
              echo "  ❌ clone falhou"
              FAILED=$((FAILED + 1)); rm -rf "$TMPDIR"; continue
            fi

            cd "$TMPDIR/$REPO"
            git config user.name "Vera Skills Bot"
            git config user.email "skills-bot@users.noreply.github.com"

            if [ "$REPO" = "vera-api" ]; then
              check_local_dev_ports "docker-compose.yml"
            fi

            mkdir -p ".claude/skills"

            declare -A CANON
            for folder in "${FOLDERS[@]}"; do
              SOURCE="$GITHUB_WORKSPACE/skills/$folder"
              [ -d "$SOURCE" ] || continue
              for skill_dir in "$SOURCE"/*/; do
                [ -d "$skill_dir" ] && CANON["$(basename "$skill_dir")"]=1
              done
            done

            for kept in $(jq -r --arg r "$REPO" '.keep[$r][]? // empty' "$GITHUB_WORKSPACE/$CONFIG_FILE"); do
              CANON["$kept"]=1
              echo "  📌 mantida local: $kept"
            done

            for existing in .claude/skills/*/; do
              [ -d "$existing" ] || continue
              name=$(basename "$existing")
              if [ -z "${CANON[$name]:-}" ]; then
                rm -rf "$existing"
                echo "  🗑️  podada: $name"
              fi
            done

            for folder in "${FOLDERS[@]}"; do
              SOURCE="$GITHUB_WORKSPACE/skills/$folder"
              [ -d "$SOURCE" ] || continue
              for skill_dir in "$SOURCE"/*/; do
                [ -d "$skill_dir" ] || continue
                skill_name=$(basename "$skill_dir")
                rm -rf ".claude/skills/$skill_name"
                mkdir -p ".claude/skills/$skill_name"
                cp -r "$skill_dir"/. ".claude/skills/$skill_name/"
              done
            done

            {
              echo "# Skills sincronizadas de $ORG/.github — não editar aqui."
              echo "# Para mudar uma skill, abra PR no .github. Grupos: ${FOLDERS[*]}"
              for name in $(printf '%s\n' "${!CANON[@]}" | sort); do echo "$name"; done
            } > ".claude/skills/.synced-from-org"
            unset CANON

            git add -fA .claude/skills

            if git diff --cached --quiet; then
              echo "  ✅ já está atualizado"
              UNCHANGED=$((UNCHANGED + 1))
              cd "$GITHUB_WORKSPACE"; rm -rf "$TMPDIR"; continue
            fi

            git commit -q -m "chore: sync skills from .github [${FOLDERS[*]}]"

            if git_auth push origin "$BRANCH" 2>&1; then
              echo "  🚀 synced"
              SYNCED=$((SYNCED + 1))
            else
              echo "  ⚠️  push bloqueado (confira os rulesets do repositório)"
              FAILED=$((FAILED + 1))
            fi

            cd "$GITHUB_WORKSPACE"; rm -rf "$TMPDIR"
          done

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Resultado: $SYNCED sincronizados · $UNCHANGED sem mudança · $FAILED falhas"
          [ "$FAILED" -eq 0 ]
